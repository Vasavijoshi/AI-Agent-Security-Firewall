# M2 policy engine + identity. Network split (AGENTFW_CONTEXT.md §5): agent-net has no internet
# route at all. pep and identity are the two dual-homed containers (identity since the pre-M3
# round-4 digest-pinning ruling — see its own networks: WHY below); neither gives the agent a new
# way out, since neither proxies agent traffic. Every service builds from the repo root as context
# (not its own subdirectory) because pep/identity import sibling packages and talk to eventstore
# over HTTP.

networks:
  agent-net:
    internal: true # WHY: no default route to the internet at all — this is the L3 non-bypassability
    # proof. `docker compose exec agent curl https://example.com` must fail here even
    # if the agent process is fully compromised.
  egress-net:
    driver: bridge # WHY: normal bridge — this is where the internet-reachable and internal-only
    # backing services (eventstore, dashboard) live, fronted only by the pep.

services:
  identity:
    build:
      context: .
      dockerfile: identity/Dockerfile
    # WHY egress-net too now (pre-M3 ruling, round 4): trust-on-first-use digest pinning has to be
    # checked against a value that survives an issuer restart, which means the eventstore
    # (events/app.py's /digest-pin routes) — identity needs a real route there. This makes
    # identity the second dual-homed container, not just pep, but it doesn't reopen the
    # non-bypassability property that invariant protects: identity never proxies agent traffic and
    # has no route *from* agent-net to the internet through it — it's a control-plane component
    # gaining a control-plane dependency, not a new way out for the agent.
    networks: [agent-net, egress-net]
    environment:
      EVENTSTORE_URL: http://eventstore:8090
      # Optional digest pre-seeds — see .env.example. Digest pinning itself is NOT optional or
      # gated by these being set: identity/issuer.py now pins whichever digest it observes on each
      # service's first successful attestation (trust-on-first-use) regardless. Setting one of
      # these just supplies the value to pin *before* trusting anything observed, so a mismatch is
      # caught starting on attestation #1 instead of only from #2 onward.
      EXPECTED_DIGEST_AGENT: ${EXPECTED_DIGEST_AGENT:-}
      EXPECTED_DIGEST_FINANCE_AGENT: ${EXPECTED_DIGEST_FINANCE_AGENT:-}
      EXPECTED_DIGEST_SUPPORT_AGENT: ${EXPECTED_DIGEST_SUPPORT_AGENT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # WHY read-only, and why this is a real trade-off, not a free lunch: see the `# WHY:` block
      # in identity/issuer.py. Mounting the socket gives this container visibility into every
      # container on the host's Docker daemon, not just this project's — bigger blast radius than
      # a "real" node attestor would have. Accepted for this scope; read-only limits it to
      # inspect-only calls (we never issue a write/control call against the socket).
    depends_on:
      eventstore:
        condition: service_healthy
        # WHY: identity's own /health doesn't check eventstore connectivity, so without this,
        # identity could report healthy before eventstore is ready and the *first* real /attest
        # call would fail transiently on "digest pin check unavailable" — a race, not a bug in the
        # check itself. Ordering container starts here closes it the same way pep's healthcheck
        # closed the agent-vs-pep race (see pep's own healthcheck WHY below).
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:8082/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    networks: [agent-net]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTFW_SCENARIO: ${AGENTFW_SCENARIO:-m1_allowed_call}
      # WHY no AGENT_ID here: identity is attested via the Docker API (identity/issuer.py), not
      # self-asserted by the agent — there is nothing left for an env var like this to configure.
      PEP_URL: http://pep:8080
      IDENTITY_ISSUER_URL: http://identity:8082
      HTTP_PROXY: http://pep:8081
      HTTPS_PROXY: http://pep:8081
      # WHY port 8081, not 8080: 8080 is the PEP's JSON tool-call API that agent/tools.py calls
      # directly (trust_env=False — see the WHY there). 8081 is the bypass-catch listener
      # (pep/bypass_proxy.py) — it exists so that any code path which DOES honor these env vars
      # (a library, an injected instruction, a compromised tool) gets a loud, attributable DENY
      # instead of either a silent connection error or, worse, accidentally reaching pep's real
      # API on 8080 without going through agent/tools.py's request shaping.
    depends_on:
      pep:
        condition: service_healthy
      identity:
        condition: service_healthy
    # WHY no restart policy: the agent is a run-once batch job (agent/main.py) that plays one
    # scripted scenario and exits — it is expected to show Exited(0), not stay Up. Read its
    # output with `docker compose logs agent`.

  # --- finance-agent, support-agent (pre-M3 multi-agent ruling) ---
  # WHY these are separate services sharing agent/Dockerfile's image, not one service with a role
  # env var: identity/issuer.py's AGENT_REGISTRY maps *compose service name* to role — a container
  # cannot claim a role via its own environment (that would be exactly the self-asserted identity
  # AGENTFW_CONTEXT.md §2 rules out). Which agent this is is a fact about which service Docker
  # says it's running as, discovered via the Docker API at attest time, not configured here.
  # AGENTFW_SCENARIO differs per service only to give each one something true to its own charter
  # to do — it has no bearing on identity or authorization.
  finance-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    networks: [agent-net]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTFW_SCENARIO: ${FINANCE_AGENT_SCENARIO:-finance_allowed_call}
      PEP_URL: http://pep:8080
      IDENTITY_ISSUER_URL: http://identity:8082
      HTTP_PROXY: http://pep:8081
      HTTPS_PROXY: http://pep:8081
    depends_on:
      pep:
        condition: service_healthy
      identity:
        condition: service_healthy

  support-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    networks: [agent-net]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENTFW_SCENARIO: ${SUPPORT_AGENT_SCENARIO:-support_allowed_call}
      PEP_URL: http://pep:8080
      IDENTITY_ISSUER_URL: http://identity:8082
      HTTP_PROXY: http://pep:8081
      HTTPS_PROXY: http://pep:8081
    depends_on:
      pep:
        condition: service_healthy
      identity:
        condition: service_healthy

  pep:
    build:
      context: .
      dockerfile: pep/Dockerfile
    networks: [agent-net, egress-net] # WHY: every byte the agent sends outward crosses this
    # boundary (§5) — the property that matters isn't "only dual-homed container" (identity is
    # dual-homed too, as of the round-4 digest-pinning ruling below) but "only container the agent
    # can reach that also reaches the internet." identity is reachable from agent-net too, but
    # identity forwards nothing anywhere on the agent's behalf.
    environment:
      EVENTSTORE_URL: http://eventstore:8090
      IDENTITY_ISSUER_URL: http://identity:8082
      POLICY_BUNDLE_PATH: /app/policy/bundles/default.yaml
    depends_on:
      eventstore:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
      # WHY this healthcheck exists at all: discovered during external verification that the
      # agent could start before pep had finished booting and exit on httpx.ConnectError before
      # pep ever came up. `depends_on` alone only orders container *starts*, not readiness — the
      # `condition: service_healthy` above (on the agent/pep edges) is what actually closes the
      # race, and it needs a real healthcheck to depend on.

  eventstore:
    build:
      context: .
      dockerfile: events/Dockerfile
    networks: [egress-net] # WHY this is also now the quarantine admin surface (events/app.py's
    # /quarantine routes): agent-net has zero route here — genuinely unreachable from the agent,
    # not just permission-checked. Release with, e.g.:
    #   docker compose exec pep curl -X DELETE http://eventstore:8090/quarantine/agent
    volumes:
      - eventstore-data:/data
    environment:
      # WHY SQLite over Postgres: the durable-log requirement in AGENTFW_CONTEXT.md §3 (log-or-deny)
      # needs fsync-before-release, not concurrent multi-writer access — the pep is the only writer.
      # SQLite is stdlib (sqlite3), so it costs zero dependency-budget slots, needs no separate DB
      # engine/container to configure, and keeps the "clone and run, no API key, no cloud account"
      # acceptance test as close to zero moving parts as the durability invariant allows.
      EVENTSTORE_DB_PATH: /data/events.db
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    networks: [egress-net] # WHY: only needs to read the event store, never touches agent-net
    environment:
      EVENTSTORE_URL: http://eventstore:8090
    ports:
      - "8501:8501" # the one port a human on the host actually needs
    depends_on:
      eventstore:
        condition: service_healthy

volumes:
  eventstore-data:

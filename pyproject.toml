[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# WHY: ruff format replaces black (AGENTFW_CONTEXT.md §7, resolved M0) — one tool for lint + format
# instead of two, frees a dependency-budget slot. Defaults already match black's style; line-length
# above is shared by both lint and format.

[tool.pytest.ini_options]
testpaths = ["tests"]
